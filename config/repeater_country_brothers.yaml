# ===================================
#  Groups for the country brothers field, stored as repeater models
# ===================================

editor:
    name: Text Editor
    icon: ph ph-file-text
    fields:
        content:
            type: richeditor
            size: large

gallery:
    name: Photos
    icon: ph ph-file-image
    fields:
        photos:
            type: fileupload
            mode: image
            imageWidth: 200
            imageHeight: 200

sister:
    name: Sister
    icon: ph ph-arrows-clockwise
    fields:
        sisters:
            label: Sister
            prompt: Add sister
            span: full
            type: repeater
            form: $/october/test/config/repeater_country_sisters.yaml
