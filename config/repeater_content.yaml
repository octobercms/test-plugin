# ===================================
#  Groups for the country content field and test-theme layouts/staticpage.htm
# ===================================

# Testing a group code with an underscore prefix, which the repeater skips
_ignored:
    name: Ignore this group

# Testing a group that loads this file again, so repeaters can nest recursively
recurse:
    name: Recurse
    description: Repeater recursion
    icon: ph ph-arrows-clockwise
    fields:
        children:
            label: Content
            prompt: Add content block
            span: full
            type: repeater
            groups: $/october/test/config/repeater_content.yaml

textarea:
    name: Textarea
    description: Basic text field
    titleFrom: text_area
    icon: ph ph-file-text
    useTabs: true
    fields:
        text_area:
            label: Text Content
            tab: Content
            type: textarea
            size: large
            default: Whether 'tis nobler in the mind to suffer. The slings and arrows of outrageous fortune, Or to take arms against a sea of troubles. And by opposing end them.
        selection:
            label: Selection
            tab: Extras
            type: dropdown
            options:
                a: a
                b: b

quote:
    name: Quote
    description: Quote item
    icon: ph ph-quotes
    titleFrom: quote_content
    fields:
        quote_position:
            span: auto
            label: Quote Position
            type: radio
            cssClass: inline-options
            options:
                left: Left
                center: Center
                right: Right
        quote_content:
            span: auto
            label: Details
            type: text
            default: I like turtles

image:
    name: Image
    description: Pick something from the media library
    icon: ph ph-image
    fields:
        img_upload:
            span: auto
            label: Image
            type: mediafinder
            mode: image
            imageHeight: 260
            imageWidth: 260

        img_position:
            span: auto
            label: Image Position
            type: radio
            options:
                left: Left
                center: Center
                right: Right

taglist:
    name: Tag list
    description: Tag list in string mode
    icon: ph ph-tag
    fields:
        tags:
            label: Tag list
            type: taglist
            mode: string

# Testing a nested form inside a repeater group
nestedform:
    name: Nested Form
    description: Testing a nested form
    icon: ph ph-gear-six
    fields:
        content:
            type: nestedform
            showPanel: false
            form:
                fields:
                    added_at:
                        label: Date Added
                        type: datepicker
                    details:
                        label: Details
                        type: textarea
                    title:
                        label: This is the title
                        type: text
