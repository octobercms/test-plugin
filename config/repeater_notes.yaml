# ===================================
#  Form for the country notes field and test-theme theme.yaml
# ===================================

fields:
    note:
        tab: Notes
        span: full
        type: richeditor

    # Testing a recordfinder inside a repeater with useRelation disabled, so it stores the selected ID
    person:
        tab: Additional Information
        label: Standalone Record Finder
        nameFrom: name
        descriptionFrom: description
        list: $/october/test/models/person/columns.yaml
        type: recordfinder
        useRelation: false
        modelClass: October\Test\Models\Person
