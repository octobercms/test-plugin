# ===================================
#  Form Field Definitions
# ===================================

fields:
    name:
        label: Name
        span: auto

    # Testing the icons preset, which lists the October icon classes (oc-icon-*)
    preset_icon:
        label: Icon (Preset)
        span: auto
        type: dropdown
        optionsPreset: icons

    preset_locales:
        label: Locales (Preset)
        span: auto
        type: dropdown
        optionsPreset: locales

    preset_locales_icons:
        label: Locales with Flags (Preset)
        span: auto
        type: dropdown
        optionsPreset: flags
