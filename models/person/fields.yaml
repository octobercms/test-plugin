# ===================================
#  Form Field Definitions
# ===================================
#
#  These fields explore the use of context; the "phone" field is rendered in
#  different ways depending on the context used by the form, passed in by
#  the URL.
# ===================================

fields:
    name:
        label: Full Name
        span: auto
        default: Joe Dirt
        commentAbove: Text field, required. Given name in the first box, preferred name in the second box.

    _previous_names:
        label: Previous Names
        span: auto
        placeholder: Enter previous names
        commentAbove: Previously used <strong>names, monikers or aliases</strong>
        commentHtml: true

    # Testing form field with no config
    preferred_name:

    # Testing a nullable attribute, where the empty option saves null instead of zero
    is_married:
        label: Married
        span: auto
        type: dropdown
        emptyOption: Unknown
        options:
            '0': No
            '1': Yes

    ajax_options:
        label: AJAX Options
        span: auto
        comment: These options should be populated using AJAX
        path: field_ajax_options
        type: partial

    # Record Finder (Default)
    phone:
        context: [create, update, recordfinder]
        label: Phone
        comment: Record finder field.
        type: recordfinder
        list: $/october/test/models/phone/columns.yaml
        title: Please pick a phone
        nameFrom: name
        descriptionFrom: number
        searchScope: customSearch
        inlineOptions: false

    # Testing RelationController rendered through a partial field, type: relation with useController is the recommended form
    phone@relationcontroller:
        label: Relation Controller
        commentAbove: RelationController used as a partial field type.
        type: partial
        path: phone

    # Relation Field
    phone@relation:
        label: Relation Field
        commentAbove: RelationController rendered by a relation field, reusing the phone definition in config_relation.yaml.
        type: relation
        useController: true

    # Proxy Fields
    _section_proxy_fields:
        context: proxyfields
        type: section
        label: Proxy Fields

    phone[name]:
        context: proxyfields
        span: auto
        label: Phone Name
        comment: Proxy text field for Phone model.

    phone[number]:
        context: proxyfields
        span: auto
        label: Phone Number
        comment: Proxy text field for Phone model.

    phone[created_at]:
        context: proxyfields
        span: left
        label: Phone Created
        comment: Proxy date picker field for Phone model.
        type: datepicker

    phone[picture]:
        label: Picture
        context: proxyfields
        span: right
        comment: Proxy file upload field for Phone model.
        type: fileupload
        mode: image
        imageHeight: 260
        imageWidth: 260

    phone[brand]:
        label: Brand
        context: proxyfields
        span: left
        comment: Proxy dropdown field for Phone model.
        type: dropdown

tabs:
    lazy:
        - Birthday
        - Activities
    icons:
        Birthday: ph ph-cake
        Activities: ph ph-person-simple-run
        Account: ph ph-key
    fields:

        birth:
            label: Born (Date Time)
            type: datepicker
            tab: Birthday
            minDate: January 01 2015 11:11
            comment: Date cannot be before January 2015, formatted as m-Y-d.
            format: m-Y-d

        birthdate:
            label: Born (Date)
            type: datepicker
            mode: date
            tab: Birthday
            minDate: 1984-04-12
            maxDate: 2014-04-23
            comment: Date must be between April 1984 - 2014.

        birthtime:
            label: Born (Time)
            type: datepicker
            mode: time
            tab: Birthday
            span: auto
            twelveHour: true
            hoursOnly: true

        favcolor:
            label: Favorite color
            type: colorpicker
            default: "#27ae60"
            tab: Birthday
            span: auto

        # Record Finder With Alternate Local Key
        alt_phone:
            label: Emergency Contact
            tab: Activities
            comment: Record finder field that uses custom keys.
            type: recordfinder
            list: $/october/test/models/phone/columns.yaml
            title: Please pick an alternative phone
            nameFrom: name
            descriptionFrom: number

        sports:
            label: Sports
            tab: Activities
            type: checkboxlist
            span: left
            cssClass: inline-options
            quickselect: true
            options:
                adventure: Adventure
                aquatic: Aquatic
                strength: Strength
                ball: Ball
                extreme: Extreme
                mountain: Mountain
                motorised: Motorised

        # Testing a checkbox list with a long list of options
        hobbies:
            label: Hobbies
            tab: Activities
            type: checkboxlist
            span: right
            quickselect: true
            options:
                3d-printing: 3D printing
                acrobatics: Acrobatics
                acting: Acting
                animation: Animation
                aquascaping: Aquascaping
                astronomy: Astronomy
                baking: Baking
                beatboxing: Beatboxing
                blogging: Blogging
                building: Building
                bowling: Bowling
                breadmaking: Breadmaking
                cabaret: Cabaret
                calligraphy: Calligraphy
                candle-making: Candle making
                card-games: Card games
                cheesemaking: Cheesemaking
                clothesmaking: Clothesmaking
                coffee-roasting: Coffee roasting
                collecting: Collecting
                coloring: Coloring
                computer programming: Computer programming
                confectionery: Confectionery
                cooking: Cooking
                cosplaying: Cosplaying
                couponing: Couponing
                craft: Craft
                creative writing: Creative writing
                crocheting: Crocheting
                cross-stitch: Cross-stitch
                crossword puzzles: Crossword puzzles
                cryptography: Cryptography
                cue-sports: Cue sports

        _account_hint:
            type: hint
            mode: info
            label: Account Details
            comment: The API key stays hidden until it is revealed, and the password is never saved.
            tab: Account

        email:
            label: Email
            type: email
            span: auto
            tab: Account

        api_key:
            label: API Key
            type: sensitive
            span: auto
            tab: Account

        # Testing a password field that is never saved, since fields starting with an underscore are purged before saving
        _password:
            label: Password
            type: password
            span: auto
            tab: Account
