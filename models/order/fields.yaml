# ===================================
#  Form Field Definitions
# ===================================

fields:
    title:
        label: Order Name
        span: auto

    price:
        label: Price
        type: number
        span: auto

tabs:
    fields:
        items:
            label: Items
            tab: Items
            type: relation
            useController: true

        # Testing a relation field with its relation controller config defined inline
        products:
            label: Products
            tab: Products
            type: relation
            controller:
                label: Product
                list: $/october/test/models/product/columns.yaml
                form: $/october/test/models/product/fields.yaml

        notes:
            label: Notes
            tab: Notes
            type: textarea
            size: huge

        # Testing a datatable field storing rows as JSON for DataTableFieldTest, the items relation is the recommended design for order lines
        line_items:
            label: Line Items
            tab: Line Items
            type: datatable
            height: 300
            columns:
                sku:
                    type: string
                    title: SKU
                    width: 400
                description:
                    type: string
                    title: Description
                    width: 600
                quantity:
                    type: numeric
                    title: Qty
                    width: 200
                unit_price:
                    type: numeric
                    title: Unit Price
                    width: 200
                taxable:
                    type: checkbox
                    title: Taxable
                    width: 150

        # Testing the datatable legacy mode as a form-only field, which is never saved
        _line_items:
            label: Line Items (Legacy)
            tab: Line Items
            type: datatable
            legacyMode: true
            height: 300
            columns:
                sku:
                    type: string
                    title: SKU
                description:
                    type: string
                    title: Description
                # Testing legacy mode, which has no numeric type, so numbers use cell validation
                quantity:
                    title: Qty
                    validation:
                        integer:
                            message: Qty must be a whole number
                unit_price:
                    title: Unit Price
                    validation:
                        float:
                            message: Unit Price must be a number
                taxable:
                    type: checkbox
                    title: Taxable

        # Testing a datatable inside repeater items for DataTableFieldTest
        blocks:
            label: Content Blocks
            tab: Blocks
            type: repeater
            prompt: Add Block
            form:
                fields:
                    heading:
                        label: Heading
                        type: text
                        span: full
                    rows:
                        label: Rows
                        type: datatable
                        columns:
                            label:
                                type: string
                                title: Label
                            value:
                                type: string
                                title: Value

        # Testing a datatable inside builder groups for DataTableFieldTest
        block_groups:
            label: Builder Blocks
            tab: Blocks
            type: repeater
            prompt: Add Block
            displayMode: builder
            groups:
                spec_table:
                    name: Specification Table
                    description: A table of specifications
                    fields:
                        specs:
                            label: Specifications
                            type: datatable
                            columns:
                                attribute:
                                    type: string
                                    title: Attribute
                                detail:
                                    type: string
                                    title: Detail
                pricing_table:
                    name: Pricing Tiers
                    description: A table of pricing tiers
                    fields:
                        tiers:
                            label: Tiers
                            type: datatable
                            columns:
                                tier:
                                    type: string
                                    title: Tier
                                price:
                                    type: numeric
                                    title: Price
