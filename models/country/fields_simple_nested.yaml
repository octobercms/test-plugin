# ===================================
#  Form Field Definitions
# ===================================

fields:

    name:
        label: Name
        span: auto
        default: Australia

    code:
        label: Code
        span: auto
        preset:
            field: name
            type: slug

    is_active:
        label: Active
        comment: Check this box to hide some tabs, using depends and trigger API.
        type: checkbox
        default: true

    # Testing a nestedform inside a relation popup form, used by the country relation on Cities
    footer:
        type: nestedform
        showPanel: false
        form: $/october/test/models/setting/nestedform.yaml

    cities:
        tab: Cities
        label: Cities
        type: relation
        useController: true
