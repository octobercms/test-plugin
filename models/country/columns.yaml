# ===================================
#  List Column Definitions
# ===================================

columns:
    # Testing a column that is not clickable, so its button opens a link instead of the record
    google_button:
        label: Action
        type: partial
        sortable: false
        clickable: false
        cssClass: column-button
        valueFrom: id
        width: 150px
        path: column_google_button

    name:
        label: Name
        searchable: true

    code:
        label: Code
        searchable: true

    is_active:
        label: Active
        type: switch

    is_default:
        label: Default
        type: switch
