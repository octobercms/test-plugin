# ===================================
#  List Column Definitions
# ===================================

columns:
    id:
        label: ID
        searchable: true

    name:
        label: Name
        searchable: true

    content:
        label: Content
        searchable: true

    is_visible:
        label: Visible
        type: switch

    mood[feeling]:
        label: Mood
        type: selectable
        optionsMethod: getFeelingzOptions

    # Testing a column for an attribute cast to a backed enum
    status:
        label: Status
        type: selectable

    # Testing a column partial borrowed from another model directory through an absolute path
    _dropdown:
        label: Dropdown
        type: partial
        path: $/october/test/models/product/_column_dropdown.php
        clickable: false
        sortable: false
