# ===================================
#  List Column Definitions
# ===================================

columns:
    id:
        label: ID
        searchable: true

    name:
        label: Name
        searchable: true

    content:
        label: Content
        searchable: true

    comments_count:
        label: Comments
        relation: comments
        relationCount: true
        type: number

    # Testing a relation column that sorts by the status order and displays its name
    status_sort_order:
        label: Status
        type: partial
        path: column_status
        relation: status
        select: sort_order
        relationWith: status
        sortable: true
