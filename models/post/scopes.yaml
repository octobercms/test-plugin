# ===================================
#  Filter Scope Definitions
# ===================================

scopes:
    published_at:
        label: Published
        type: date
        conditions:
            between: october_test_posts.published_at >= :after AND october_test_posts.published_at <= :before

    name:
        label: Name
        type: text
        conditions:
            equals: october_test_posts.name = :value

    status:
        label: Status
        modelClass: October\Test\Models\Attribute
        conditions: status_id in (:filtered)
        nameFrom: name
