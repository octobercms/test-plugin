# ===================================
#  Form Field Definitions
# ===================================

fields:
    is_active:
        label: Is Active
        span: full
        type: switch
        default: true

    title:
        label: Title
        span: full
        type: text

    url:
        label: URL
        span: full
        type: text

    image_desktop:
        label: Image Desktop
        mode: image
        fileTypes: 'png'
        useCaption: false
        thumbOptions:
            mode: crop
            extension: auto
        span: full
        type: fileupload

    caption_image:
        label: Caption Image
        comment: Same file for every locale, translated title and description.
        mode: image
        span: full
        type: fileupload
