# ===================================
#  List Column Definitions
# ===================================

columns:
    id:
        label: ID
        searchable: true

    username:
        label: Username
        searchable: true
        select: concat(id, ' ', username)

    roles:
        label: Roles
        relation: roles
        select: name

    roles_count:
        label: Roles
        relation: roles
        relationCount: true
        type: number

    photo:
        label: Photo
        type: image
        sortable: false

    created_at:
        label: Created
        type: timetense
        invisible: true

    updated_at:
        label: Updated
        type: timetense
        invisible: true
