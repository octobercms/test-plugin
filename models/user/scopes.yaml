# ===================================
#  Filter Scope Definitions
# ===================================

scopes:
    username:
        label: Username
        type: text

    # Testing a dropdown scope that only exercises the UI, since users have no status column and the condition matches every row
    status:
        label: Status
        type: dropdown
        options:
            pending: Pending
            active: Active
            closed: Closed
        conditions: '1 = 1'

    roles:
        type: group
        label: Role
        modelScope: applyRoleFilter
        modelClass: October\Test\Models\Role
        optionsScope: applyRoleOptionsFilter
        nameFrom: name
        dependsOn: disable_roles
        matchMode: toggle

    disable_roles:
        type: checkbox
        label: Disable Roles
        conditions: id = 1

    disable_roles_switch:
        type: switch
        label: First & Second
        conditions:
            - id = 1
            - id = 2

    id:
        type: number
        label: ID
        default: 1

    created_at:
        label: Created
        type: date
        showWeekNumber: true
        default: '2020-01-02'

    discount:
        label: Discount (Custom)
        type: discount
        allowSearch: true

    testsearch:
        label: Search (Custom)
        type: inlinesearch

    testtoggle:
        label: Switch (Custom)
        type: inlineballoon
        options:
            Neo: Neo
            Morpheus: Morpheus
