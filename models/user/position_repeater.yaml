# ===================================
#  Repeater Group Definitions
# ===================================

product:
    name: Product
    description: Add product from catalog
    icon: ph ph-file-text
    fields:
        # Testing record finder pagination inside a repeater, showing one record per page with the setup button
        _product:
            label: Product
            nameFrom: title
            descriptionFrom: description_short
            list: $/october/test/models/product/columns.yaml
            type: recordfinder
            showSetup: true
            recordsPerPage: 1
            useRelation: false
            modelClass: October\Test\Models\Product
            spanClass: col-12
