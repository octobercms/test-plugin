# ===================================
#  List Column Definitions
# ===================================

columns:
    id:
        label: ID
        type: number
        order: 200

    title:
        label: Title
        order: 800

    type:
        label: Type
        type: selectable
        order: 700
        options:
            1: [Simple, 'ph ph-clock']
            2: [Complex, 'ph ph-warning-circle']
            # Testing an image URL in place of an icon class, detected by the dot in the value
            3: [Featured, '/modules/backend/assets/images/october-leaf.svg']

    parent:
        label: Parent
        relation: parent
        select: title
        order: 600

    content[title]:
        label: Content
        type: text
        order: 500

    status:
        label: Status
        type: selectable
        order: 900
