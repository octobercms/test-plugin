# ===================================
#  Form Behavior Config
# ===================================

# Record name
name: Company

# Model Form Field configuration
form: $/october/test/models/company/fields.yaml

# Model Class name
modelClass: October\Test\Models\Company

# Default redirect location
defaultRedirect: october/test/companies

# Form Design
design:
    displayMode: basic

# Create page
create:
    title: Create Company
    redirect: october/test/companies/update/:id
    redirectClose: october/test/companies

# Update page
update:
    title: Edit Company
    redirect: october/test/companies
    redirectClose: october/test/companies

# Preview page
preview:
    title: Preview Company
