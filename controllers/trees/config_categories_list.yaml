# ===================================
#  List Behavior Config
# ===================================

# Model List Column configuration
list: $/october/test/models/category/columns.yaml

# Model Class name
modelClass: October\Test\Models\Category

# List Title
title: Manage Categories

# Link URL for each record
recordUrl: october/test/categories/update/:id

# Message to display if the list is empty
noRecordsMessage: backend::lang.list.no_records

# Records to display per page
recordsPerPage: 20

# Displays the list column set up button
showSetup: true

# Show tree (v2)
structure:
    showTree: true
    showReorder: true
    # Testing maxDepth limit
    maxDepth: 2
    # Testing dragRow disabled, so only the reorder handle drags
    dragRow: false
    # Testing structure permissions
    permissions: october.test.reorder_trees

# Toolbar widget configuration
toolbar:
    # Partial for toolbar buttons
    buttons: list_categories_toolbar

    # Search widget configuration
    search:
        prompt: backend::lang.list.search_prompt
