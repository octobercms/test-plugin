# ===================================
#  Import/Export Behavior Config
# ===================================

import:
    # Page title
    title: Import Pages

    # Import List Column configuration
    list: $/october/test/models/page/columns_import.yaml

    # Import Model class
    modelClass: October\Test\Models\Page\PageImport

    # Redirect when finished
    redirect: october/test/pages

export:
    # Page title
    title: Export Pages

    # Output file name
    fileName: pages.csv

    # Export List Column configuration
    list: $/october/test/models/page/columns_export.yaml

    # Export Model class
    modelClass: October\Test\Models\Page\PageExport

    # Redirect when finished
    redirect: october/test/pages

    # Testing custom fields on the export options form, read by PageExport as skip_first_record
    form:
        fields:
            skip_first_record:
                label: Skip first record
                type: checkbox
                default: true
