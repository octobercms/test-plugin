# ===================================
#  Form Behavior Config
# ===================================

# Record name
name: User

# Model Form Field configuration
form: $/october/test/models/user/fields.yaml

# Model Class name
modelClass: October\Test\Models\User

# Default redirect location
defaultRedirect: october/test/users

# Form Design
design:
    displayMode: basic

# Create page
create:
    title: Create User
    redirect: october/test/users/update/:id
    redirectClose: october/test/users

# Update page
update:
    title: Edit User
    redirect: october/test/users
    redirectClose: october/test/users

# Preview page
preview:
    title: Preview User
