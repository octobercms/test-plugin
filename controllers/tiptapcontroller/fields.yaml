# ===================================
#  Form Field Definitions
# ===================================

fields:
    vue_editor:
        label: Rich Editor (Vue)
        type: richeditor
        size: huge

    froala_editor:
        label: Froala (JS only)
        type: partial
        path: field_froala

    tiptap_editor:
        label: TipTap
        type: partial
        path: field_tiptap

    tiptap_full_editor:
        label: TipTap (every button)
        type: partial
        path: field_tiptap
        toolbarButtons: paragraphFormat, paragraphStyle, fontFamily, fontSize, |, bold, italic, underline, strikeThrough, subscript, superscript, color, inlineStyle, clearFormatting, |, align, formatOL, formatUL, outdent, indent, quote, |, insertLink, insertPageLink, insertImage, insertVideo, insertAudio, insertFile, insertTable, insertSnippet, insertHR, emoticons, |, undo, redo, selectAll, html, fullscreen

