# ===================================
#  Form Behavior Config
# ===================================

# Record name
name: Product Category

# Model Form Field configuration
form: $/october/test/models/productcategory/fields.yaml

# Model Class name
modelClass: October\Test\Models\ProductCategory

# Default redirect location
defaultRedirect: october/test/productcategories

# Form Design
design:
    displayMode: basic

# Create page
create:
    title: Create Product Category
    redirect: october/test/productcategories/update/:id
    redirectClose: october/test/productcategories

# Update page
update:
    title: Edit Product Category
    redirect: october/test/productcategories
    redirectClose: october/test/productcategories

# Preview page
preview:
    title: Preview Product Category
