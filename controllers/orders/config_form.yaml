# ===================================
#  Form Behavior Config
# ===================================

# Record name
name: Order

# Model Form Field configuration
form: $/october/test/models/order/fields.yaml

# Model Class name
modelClass: October\Test\Models\Order

# Default redirect location
defaultRedirect: october/test/orders

# Form Design
design:
    displayMode: basic

# Create page
create:
    title: Create Order
    redirect: october/test/orders/update/:id
    redirectClose: october/test/orders

# Update page
update:
    title: Edit Order
    redirect: october/test/orders
    redirectClose: october/test/orders

# Preview page
preview:
    title: Preview Order
