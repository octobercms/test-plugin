# ===================================
#  Form Behavior Config
# ===================================

# Record name
name: Person

# Model Form Field configuration
form: $/october/test/models/person/fields.yaml

# Model Class name
modelClass: October\Test\Models\Person

# Default redirect location
defaultRedirect: october/test/people

# Form Design
design:
    displayMode: basic

# Create page
create:
    title: Create Person
    redirect: october/test/people/update/:id
    redirectClose: october/test/people

# Update page
update:
    title: Edit Person
    redirect: october/test/people
    redirectClose: october/test/people

# Preview page
preview:
    title: Preview Person
