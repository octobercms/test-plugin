# ===================================
#  Form Behavior Config
# ===================================

# Record name
name: Country

# Model Form Field configuration
form: $/october/test/models/country/fields.yaml

# Model Class name
modelClass: October\Test\Models\Country

# Default redirect location
defaultRedirect: october/test/countries

# Form Design
design:
    displayMode: basic

# Create page
create:
    title: Create Country
    redirect: october/test/countries/update/:id
    redirectClose: october/test/countries

# Update page
update:
    title: Edit Country
    redirect: october/test/countries
    redirectClose: october/test/countries

# Preview page
preview:
    title: Preview Country
