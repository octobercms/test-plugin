# ===================================
#  Form Behavior Config
# ===================================

# Record name
name: Post

# Model Form Field configuration
form: $/october/test/models/post/fields.yaml

# Model Class name
modelClass: October\Test\Models\Post

# Default redirect location
defaultRedirect: october/test/posts

# Form Design
design:
    displayMode: basic

# Create page
create:
    title: Create Post (Custom Text)
    redirect: october/test/posts/update/:id
    redirectClose: october/test/posts

# Update page
update:
    title: Edit Post (Awesome Title)
    redirect: october/test/posts
    redirectClose: october/test/posts

# Preview page
preview:
    title: Preview Post
