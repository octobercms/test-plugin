# ===================================
#  List Behavior Config
# ===================================

# Model List Column configuration
list: $/october/test/models/comment/columns.yaml

# Displays the list filter
filter: $/october/test/models/comment/scopes.yaml

# Model Class name
modelClass: October\Test\Models\Comment

# List Title
title: Manage Comments

# Testing a popup opened with the jQuery API, since the comment_mode flag must be posted with the handler, controllers/plugins shows recordOnClick: popup for a single model
recordOnClick: "$.popup({ handler: 'onLoadUpdateForm', extraData: { comment_mode: 1, record_id: ':id' } })"

# Message to display if the list is empty
noRecordsMessage: backend::lang.list.no_records

# Records to display per page
recordsPerPage: 20

# Displays the list column set up button
showSetup: true

# Displays the sorting link on each column
showSorting: true

# Toolbar widget configuration
toolbar:
    # Partial for toolbar buttons
    buttons: list_comments_toolbar

    # Search widget configuration
    search:
        prompt: backend::lang.list.search_prompt
