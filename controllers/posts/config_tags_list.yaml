# ===================================
#  List Behavior Config
# ===================================

# Model List Column configuration
list: $/october/test/models/tag/columns.yaml

# Model Class name
modelClass: October\Test\Models\Tag

# List Title
title: Manage Tags

# Testing a popup opened with the jQuery API, since the tag_mode flag must be posted with the handler, controllers/plugins shows recordOnClick: popup for a single model
recordOnClick: "$.popup({ handler: 'onLoadUpdateForm', extraData: { tag_mode: 1, record_id: ':id' } })"

# Message to display if the list is empty
noRecordsMessage: backend::lang.list.no_records

# Records to display per page
recordsPerPage: 20

# Displays the list column set up button
showSetup: true

# Displays the sorting link on each column
showSorting: true

# Toolbar widget configuration
toolbar:
    # Partial for toolbar buttons
    buttons: list_tags_toolbar

    # Search widget configuration
    search:
        prompt: backend::lang.list.search_prompt
